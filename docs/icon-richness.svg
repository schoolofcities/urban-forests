<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- 3 distinct tree shapes in brand greens, brown trunks -->
  <!-- conical / spruce — darkGreen -->
  <polygon points="14,62 20,30 26,62" fill="#0D534D"/>
  <rect x="18" y="62" width="4" height="8" fill="#7a4f2d"/>
  <!-- round broadleaf — lightGreen -->
  <circle cx="40" cy="42" r="12" fill="#8DBF2E"/>
  <rect x="37" y="54" width="6" height="14" fill="#7a4f2d"/>
  <!-- vase / elm shape — medGreen -->
  <ellipse cx="59" cy="38" rx="10" ry="14" fill="#00A189" transform="rotate(-10 59 38)"/>
  <ellipse cx="63" cy="36" rx="7" ry="10" fill="#0D534D" transform="rotate(10 63 36)"/>
  <rect x="57" y="52" width="5" height="14" fill="#7a4f2d"/>
</svg>
