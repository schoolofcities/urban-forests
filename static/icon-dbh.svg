<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- tree trunk cross-section with brand colours -->
  <circle cx="40" cy="40" r="28" fill="#c8a97a" stroke="#7a4f2d" stroke-width="2"/>
  <circle cx="40" cy="40" r="22" fill="none" stroke="#00A189" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="40" cy="40" r="16" fill="none" stroke="#0D534D" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="40" cy="40" r="10" fill="none" stroke="#0D534D" stroke-width="0.8" stroke-dasharray="3 2"/>
  <circle cx="40" cy="40" r="4" fill="#7a4f2d"/>
  <!-- diameter arrow -->
  <line x1="12" y1="40" x2="68" y2="40" stroke="#0D534D" stroke-width="1.5" marker-start="url(#da)" marker-end="url(#db)"/>
  <defs>
    <marker id="da" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6" fill="none" stroke="#0D534D" stroke-width="1.2"/>
    </marker>
    <marker id="db" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M6,0 L0,3 L6,6" fill="none" stroke="#0D534D" stroke-width="1.2"/>
    </marker>
  </defs>
</svg>
