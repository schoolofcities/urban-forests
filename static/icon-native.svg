<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- donut: non-native in light grey, native portion in medGreen -->
  <circle cx="40" cy="40" r="26" stroke="#d0d0d0" stroke-width="12" fill="none"/>
  <!-- circumference = 2π×26 ≈ 163.4, ~60% native = 98 -->
  <circle cx="40" cy="40" r="26" stroke="#00A189" stroke-width="12" fill="none"
    stroke-dasharray="98 163.4" stroke-dashoffset="40.85"
    transform="rotate(-90 40 40)"/>
  <!-- leaf in centre — darkGreen fill, lightGreen stem -->
  <path d="M40,32 C44,36 46,42 40,48 C34,42 36,36 40,32Z" fill="#0D534D"/>
  <line x1="40" y1="48" x2="40" y2="52" stroke="#8DBF2E" stroke-width="1.8"/>
</svg>
